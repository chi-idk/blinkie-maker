<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>♡ Blinkie Maker ♡</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================================
       HEADER
  ========================================== -->

  <header class="site-header">

    <div>
      <h1>♡ Blinkie Maker ♡</h1>

      <p>
        make cute little animated blinkies!
      </p>
    </div>

    <div class="header-buttons">

      <button id="clearBtn">
        Clear
      </button>

      <button id="exportBtn" class="primary">
        Export
      </button>

    </div>

  </header>


  <!-- =========================================
       MAIN EDITOR
  ========================================== -->

  <main class="editor">


    <!-- =======================================
         LEFT SIDEBAR
    ======================================== -->

    <aside class="panel tools">


      <!-- ELEMENTS -->

      <section>

        <h2>♡ Elements</h2>

        <button
          id="addTextBtn"
          class="add-button"
        >
          ＋ Add Text
        </button>

        <button
          id="addImageBtn"
          class="add-button"
        >
          ＋ Add Image
        </button>
        <input
            id="newImageUpload"
            type="file"
            accept="image/png,image/jpeg,image/webp"
            hidden
        >

      </section>


      <!-- TEXT -->

      <section>

        <h2>♡ Text</h2>

        <label>
          Text

          <input
            id="textInput"
            type="text"
            value="HELLO!"
          >
        </label>


        <label>
          Text color

          <input
            id="textColor"
            type="color"
            value="#ffffff"
          >
        </label>


        <label>
          Font size

          <input
            id="fontSize"
            type="number"
            value="14"
            min="6"
            max="40"
          >
        </label>


        <label>
          X position

          <input
            id="textX"
            type="number"
            value="150"
          >
        </label>


        <label>
          Y position

          <input
            id="textY"
            type="number"
            value="30"
          >
        </label>

      </section>


      <!-- IMAGE -->

      <section id="imageControls">

        <h2>♡ Image</h2>


        <label class="upload">

          Upload image

          <input
            id="imageUpload"
            type="file"
            accept="image/png,image/jpeg,image/webp"
          >

        </label>


        <label>
          Width

          <input
            id="imageWidth"
            type="number"
            value="100"
            min="1"
          >
        </label>


        <label>
          Height

          <input
            id="imageHeight"
            type="number"
            value="50"
            min="1"
          >
        </label>


        <label>
          X position

          <input
            id="imageX"
            type="number"
            value="150"
          >
        </label>


        <label>
          Y position

          <input
            id="imageY"
            type="number"
            value="30"
          >
        </label>

      </section>


      <!-- BACKGROUND -->

      <section>

        <h2>♡ Background</h2>

        <label>

          Color

          <input
            id="backgroundColor"
            type="color"
            value="#73c9f5"
          >

        </label>

      </section>


      <!-- BORDER -->

      <section>

        <h2>♡ Border</h2>

        <label class="upload">

          Upload border

          <input
            id="borderUpload"
            type="file"
            accept="image/*"
          >

        </label>


        <button id="removeBorder">
          Remove border
        </button>

      </section>


      <!-- ANIMATION -->

      <section>

        <h2>♡ Animation</h2>

        <label>

          Effect

          <select id="animationSelect">

            <option value="none">
              None
            </option>

            <option value="blink">
              Blink
            </option>

            <option value="pulse">
              Pulse
            </option>

            <option value="rainbow">
              Rainbow
            </option>

          </select>

        </label>


        <label>

          Speed

          <input
            id="speedInput"
            type="range"
            min="1"
            max="10"
            value="5"
          >

        </label>

      </section>


      <!-- LAYERS -->

      <section class="layers-section">

  <h2>♡ Layers</h2>

  <div
    id="layersList"
    class="layers-list"
  >
  </div>


  <button
    id="deleteLayerBtn"
    class="delete-button"
  >
    ♡ Delete Selected
  </button>

</section>


    </aside>


    <!-- =======================================
         PREVIEW
    ======================================== -->

    <section class="preview-area">

      <div class="preview-window">


        <!-- WINDOW BAR -->

        <div class="window-bar">

          <span>
            ♡ blinkie preview ♡
          </span>

          <div class="window-buttons">

            <i></i>
            <i></i>
            <i></i>

          </div>

        </div>


        <!-- CANVAS -->

        <div class="canvas-container">

          <canvas
            id="blinkieCanvas"
            width="300"
            height="60"
          ></canvas>

        </div>


      </div>


      <p class="hint">

        ✦ Upload your own images and borders,
        customize your text, and experiment!

      </p>


    </section>


  </main>


  <!-- =========================================
       FOOTER
  ========================================== -->

  <footer>

    made with ♡ and lots of sparkles

  </footer>


  <script src="script.js"></script>

</body>
</html>
