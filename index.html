<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>♡ Blinkie Maker ♡</title> 
  <link rel="stylesheet" href="style.css"> 
</head> 
  <body> 
    <header class="site-header"> 
      <div> 
        <h1>♡ Blinkie Maker ♡
        </h1> 
        <p>make cute little animated blinkies!</p> 
      </div>
<div class="header-buttons">
  <button id="clearBtn">Clear</button>
  <button id="exportBtn" class="primary">Export</button>
</div>

</header> 
    <main class="editor">
<!-- LEFT TOOLBAR -->
<aside class="panel tools">

  <section>
  <h2>♡ Text</h2>

  <button id="addTextBtn" class="add-button">
    ＋ Add Text
  </button>

  <label>
    Text
    <input id="textInput" type="text" value="HELLO!">
  </label>

  <label>
    Text color
    <input id="textColor" type="color" value="#ffffff">
  </label>

  <label>
    Font size
    <input id="fontSize" type="number" value="14" min="6" max="40">
  </label>

  <label>
    X position
    <input id="textX" type="number" value="150">
  </label>

  <label>
    Y position
    <input id="textY" type="number" value="30">
  </label>

  <button id="deleteLayerBtn" class="delete-button">
    ♡ Delete Selected
  </button>
</section>

  <section>
    <h2>♡ Background</h2>

    <label>
      Color
      <input id="backgroundColor" type="color" value="#73c9f5">
    </label>
  </section>

  <section>
    <h2>♡ Border</h2>

    <label class="upload">
      Upload border
      <input id="borderUpload" type="file" accept="image/*">
    </label>

    <button id="removeBorder">Remove border</button>
  </section>

  <section>
    <h2>♡ Animation</h2>

    <label>
      Effect
      <select id="animationSelect">
        <option value="none">None</option>
        <option value="blink">Blink</option>
        <option value="pulse">Pulse</option>
        <option value="rainbow">Rainbow</option>
      </select>
    </label>

    <label>
      Speed
      <input id="speedInput" type="range" min="1" max="10" value="5">
    </label>
  </section>

  <section class="layers-section">
  <h2>♡ Layers</h2>

  <div id="layersList" class="layers-list">
    <!-- Layers are generated by JavaScript -->
  </div>
</section>

</aside>

<!-- PREVIEW -->
<section class="preview-area">

  <div class="preview-window">
    <div class="window-bar">
      <span>♡ blinkie preview ♡</span>
      <div class="window-buttons">
        <i></i>
        <i></i>
        <i></i>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="blinkieCanvas" width="300" height="60"></canvas>
    </div>
  </div>

  <p class="hint">
    ✦ Upload your own border, customize your text, and experiment!
  </p>

</section>

</main> <footer> made with ♡ and lots of sparkles </footer> <script src="script.js"></script> </body> </html>
